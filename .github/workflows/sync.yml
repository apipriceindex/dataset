# Sync quotidien de l'index vers Hugging Face Datasets.
# 07:30 UTC = après le fetch prix quotidien de 06:00 (marge franche).
# Auth : secret HF_TOKEN du repo (token write HF, déposé par Alexandre,
# jamais dans le code). Échec du sync → le snapshot précédent reste servi.
name: sync
on:
  schedule:
    - cron: "30 7 * * *"
    # Maintien en vie (2026-10-26) : GitHub désactive les tâches planifiées d'un
    # dépôt public resté 60 jours sans activité. Ce dépôt ne porte que le script :
    # sans commit, le sync quotidien se serait arrêté seul vers fin novembre.
    - cron: "0 8 1 * *"
  workflow_dispatch:

jobs:
  hf:
    if: github.event.schedule != '0 8 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - run: python sync_hf.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  keepalive:
    if: github.event.schedule == '0 8 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: scheduled sync stays enabled"
          git push
